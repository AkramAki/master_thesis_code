[run]
name = "experiment"
seed = 42

[tracking]
enabled = false
study = "notebook_test"

[trainer]
max_epochs = 1
accelerator = "auto"
devices = 1
log_every_n_steps = 1
check_val_every_n_epoch = 1

[data]
# Data directory: MOJAVE_DATA_ROOT/Mojave_I_<image_size>, resolved through .env.
type = "mojave"
image_size = 256
batch_size = 4
num_workers = 0
val_fraction = 0.1
test_fraction = 0.1
seed = 42

[data.normalization]
enabled = true
transform = "linear"
bounds = "per_image"
log_scale = 1.0

[model]
type = "conditioned_dit"
in_channels = 1
out_channels = 1
patch_size = 32
hidden_size = 64
depth = 2
num_heads = 4
mlp_ratio = 2.0
conditioning_params = [
    "jet_pa_deg",
    "jet_radial_extent_mas",
    "cropped_image_pixel_minimum",
    "cropped_image_pixel_maximum",
]

[model.conditioning_settings]
use_validity_masks = true

[diffusion]
num_steps = 100
beta_start = 0.0001
beta_end = 0.02

[loss]
loss = ["MSELoss"]
weights = [1.0]

[optimizer]
type = "AdamW"
learning_rate = 0.0001
weight_decay = 0.0
betas = [0.9, 0.999]
eps = 0.00000001
amsgrad = false

[samples]
enabled = true
num_samples = 16
every_n_epochs = 1
seed = 42
nrow = 4
save_final_grid = true
save_denoising_grids = true

[samples.conditioning]
mode = "auto"
