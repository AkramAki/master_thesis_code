[run]
name = "mojave_dit_pixel_256_patch8"
seed = 42
output_dir = "/cephfs/users/aaki/radio_diffusion_models/mojave_256/mojave_dit_pixel_256_patch8"

[tracking]
enabled = true
study = "transformer_comparison"

[trainer]
max_epochs = 100
accelerator = "gpu"
devices = 3
log_every_n_steps = 50
check_val_every_n_epoch = 1

[samples]
enabled = true
shape = [16, 1, 256, 256]
every_n_epochs = 25
nrow = 4

[early_stopping]
enabled = false
patience = 20
min_delta = 0.001

[model]
type = "dit"
in_channels = 1
patch_size = 8
hidden_size = 384
depth = 12
num_heads = 6
mlp_ratio = 4.0

[diffusion]
num_steps = 1000
beta_start = 0.0001
beta_end = 0.02

[loss]
loss = ["MSELoss"]
weights = [1.0]

[optimizer]
type = "AdamW"
learning_rate = 0.0001
weight_decay = 0.0

[data]
type = "mojave"
variant = "mojave_i_crop_v1"
data_dir = "data/Mojave_I_256"
remote_source = "nuradio:/cephfs/users/aaki/data/Mojave_I_256"
batch_size = 32
num_workers = 32
val_fraction = 0.1
test_fraction = 0.1
